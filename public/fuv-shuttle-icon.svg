<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>

  <!-- Glowing background aura -->
  <circle cx="256" cy="240" r="140" fill="#3b82f6" opacity="0.15" filter="url(#glow)"/>

  <!-- Bus Body -->
  <g transform="translate(106, 100)">
    <!-- Main Chassis -->
    <rect x="15" y="40" width="270" height="230" rx="36" fill="url(#busGrad)"/>
    
    <!-- Top Destination Display Box -->
    <rect x="65" y="56" width="170" height="26" rx="8" fill="#0f172a"/>
    <text x="150" y="74" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="2">FUV SHUTTLE</text>

    <!-- Windshield & Front Glass -->
    <rect x="35" y="94" width="230" height="96" rx="18" fill="#0f172a"/>
    <!-- Glass reflection -->
    <path d="M 45 104 L 120 104 L 80 180 L 45 180 Z" fill="rgba(255,255,255,0.1)"/>

    <!-- Dynamic Accent Speed Stripe -->
    <rect x="15" y="202" width="270" height="12" fill="url(#accentGrad)"/>

    <!-- Headlights -->
    <circle cx="55" cy="235" r="15" fill="#fef08a" filter="url(#glow)"/>
    <circle cx="55" cy="235" r="10" fill="#ffffff"/>

    <circle cx="245" cy="235" r="15" fill="#fef08a" filter="url(#glow)"/>
    <circle cx="245" cy="235" r="10" fill="#ffffff"/>

    <!-- Grille / Bumper -->
    <rect x="95" y="226" width="110" height="18" rx="6" fill="#1e293b"/>
    <line x1="110" y1="235" x2="190" y2="235" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

    <!-- Wheels -->
    <rect x="38" y="260" width="40" height="26" rx="8" fill="#020617"/>
    <rect x="222" y="260" width="40" height="26" rx="8" fill="#020617"/>
    
    <!-- Red Live Indicator Dot -->
    <circle cx="255" cy="52" r="8" fill="#ef4444"/>
    <circle cx="255" cy="52" r="14" fill="none" stroke="#ef4444" opacity="0.6" stroke-width="2"/>
  </g>
</svg>
